name: 'Green DiSC: save record'
description: 'Save a Green DiSC record issue (Markdown tables) to CSV files on `/save`, flag unsaved edits, and remove a record''s rows when it is closed.'

inputs:
  data-dir:
    description: 'Directory for the CSV files.'
    required: false
    default: 'data'
  token:
    description: 'Token with contents: write and issues: write.'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'

    # Issue content is untrusted: it only reaches the script through env and files.
    - name: Handle record issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        DATA_DIR: ${{ inputs.data-dir }}
        EVENT: ${{ github.event_name }}
        ACTION: ${{ github.event.action }}
        BODY_CHANGED: ${{ github.event.changes.body && 'true' || '' }}
        LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        ISSUE: ${{ github.event.issue.number }}
        AUTHOR: ${{ github.event.issue.user.login }}
        AUTHOR_TYPE: ${{ github.event.issue.user.type }}
        STATE: ${{ github.event.issue.state }}
        BODY: ${{ github.event.issue.body }}
        SENDER: ${{ github.event.sender.login }}
        MILESTONE_CREATED: ${{ github.event.issue.milestone.created_at }}
        BRANCH: ${{ github.event.repository.default_branch }}
        COMMENT: ${{ github.event.comment.body }}
        COMMENTER: ${{ github.event.comment.user.login }}
      run: |
        # A comment must be exactly /save (surrounding whitespace allowed).
        if [ "$EVENT" = issue_comment ] && ! [[ "$COMMENT" =~ ^[[:space:]]*/save[[:space:]]*$ ]]; then
          echo "Comment is not /save; nothing to do."
          exit 0
        fi
        # Title-only edits change nothing to save.
        if [ "$ACTION" = edited ] && [ -z "$BODY_CHANGED" ]; then
          echo "Body not changed; nothing to do."
          exit 0
        fi
        script="$GITHUB_ACTION_PATH/save_record.py"
        body_file="$RUNNER_TEMP/record-body.md"
        message="$RUNNER_TEMP/record-message.md"
        reply="$RUNNER_TEMP/record-reply.md"
        printf '%s' "$BODY" > "$body_file"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Run a script command (save or remove) on the latest branch, then
        # commit and push the data files, re-applying it on a rejected push.
        # Sets $commit_url (empty if nothing changed), and $invalid if the
        # script rejected the record (exit 3), with the reasons in $message.
        # Any other failure stops the step. Don't call it as an `if`
        # condition: that turns off errexit inside the function.
        commit_data() {
          local command=$1 subject=$2 attempt status
          invalid=""
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            python "$script" "$command" --body-file "$body_file" --issue "$ISSUE" \
              --data-dir "$DATA_DIR" --message-file "$message" || {
              status=$?
              if [ "$status" -eq 3 ]; then invalid=1; return 0; fi
              exit "$status"
            }
            git add "$DATA_DIR"
            commit_url=""
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -q -m "$subject"
            if git push -q origin "HEAD:$BRANCH"; then
              commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$(git rev-parse HEAD)"
              return 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Could not push after 5 attempts"
          exit 1
        }

        # Members close their own review check-in when they're done. If items
        # are unticked, or a record on it wasn't saved during this review (a
        # bot reply to /save since the milestone was created; a hand tick
        # doesn't count), it's reopened. Maintainers and admins (the
        # representative) can close any check-in, e.g. for a member on leave.
        if jq -e 'index("check-in")' <<< "$LABELS" > /dev/null; then
          if [ "$ACTION" != closed ]; then
            echo "Check-in edit; nothing to do."
            exit 0
          fi
          role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" -q .role_name || echo none)
          if [ "$role" = admin ] || [ "$role" = maintain ]; then
            echo "Closed by a maintainer or admin; left closed."
            exit 0
          fi
          missing=()
          while IFS= read -r item; do
            [ -n "$item" ] && missing+=("$item (not ticked)")
          done < <(python "$script" unticked --body-file "$body_file")
          for record in $(python "$script" records --body-file "$body_file"); do
            if [ -z "$MILESTONE_CREATED" ]; then
              missing+=("this check-in isn't part of a review (no milestone); ask the Green DiSC representative")
              break
            fi
            saved=$(gh api "repos/$GITHUB_REPOSITORY/issues/$record/comments?since=$MILESTONE_CREATED&per_page=100" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("Saved in") or startswith("No changes")) | .id')
            [ -z "$saved" ] && missing+=("#$record hasn't been saved during this review: comment \`/save\` on it")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            gh issue reopen "$ISSUE"
            {
              echo "Reopened: this check-in isn't finished yet."
              echo
              printf -- '- %s\n' "${missing[@]}"
              echo
              echo "Close it again once everything is done."
            } > "$reply"
            gh issue comment "$ISSUE" --body-file "$reply"
          fi
          exit 0
        fi

        # Closing a record (its owner left) removes its rows, so the data files
        # hold current evidence only. Reopening and /save restores them.
        if [ "$ACTION" = closed ]; then
          if ! jq -e 'any(. == "personal-record" or . == "group-record")' <<< "$LABELS" > /dev/null; then
            echo "Not a record; nothing to do."
            exit 0
          fi
          commit_data remove "Remove closed Green DiSC record #$ISSUE"
          if [ -n "$commit_url" ]; then
            {
              echo "This record is closed, so its rows were removed from the data files in $commit_url."
              echo
              cat "$message"
              printf '\n\n'
              echo "If it was closed by mistake, reopen it and comment \`/save\` to restore them."
            } > "$reply"
            gh issue comment "$ISSUE" --body-file "$reply"
          fi
          exit 0
        fi

        kind=$(python "$script" kind --body-file "$body_file")
        if [ -z "$kind" ]; then
          echo "Not a Green DiSC record; nothing to do."
          exit 0
        fi
        label="$kind-record"
        unsaved="unsaved changes"
        # Templates don't copy labels, so make sure ours exist.
        labels=$(gh label list --limit 500 --json name --jq '.[].name')
        grep -qxF "$label" <<< "$labels" \
          || gh label create "$label" --color 2E7D32 --description "Green DiSC $kind record" > /dev/null
        grep -qxF "$unsaved" <<< "$labels" \
          || gh label create "$unsaved" --color FBCA04 --description "Green DiSC record edited since its last /save" > /dev/null

        # A record's owner is whoever created it, or, for records created by a
        # review (the bot), whoever they were first assigned to. Not the
        # current assignee: anyone with write access can change that.
        owner="$AUTHOR"
        if [ "$AUTHOR_TYPE" = Bot ]; then
          owner=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/events" --paginate \
            | jq -rs '[.[][] | select(.event == "assigned")][0].assignee.login // empty')
          owner="${owner:-$AUTHOR}"
        fi
        # One record per person (personal) or per repository (group): only the
        # oldest labelled one counts.
        owner_of='(.assignees[0].login // .author.login)'
        filter='.[] | select(.number < $n)'
        if [ "$kind" = personal ]; then filter+=" | select($owner_of == \$o)"; fi
        older=$(gh issue list --label "$label" --state all --limit 500 \
          --json number,author,assignees \
          | jq -r --argjson n "$ISSUE" --arg o "$owner" "$filter | .number" | sort -n | head -n 1)

        if [ "$ACTION" = edited ]; then
          # Only edits to the record itself count, not to duplicates or to
          # issues that merely look like a record.
          if [ -n "$older" ] || ! jq -e --arg l "$label" 'index($l)' <<< "$LABELS" > /dev/null; then
            echo "Not a saved record; nothing to do."
            exit 0
          fi
          gh issue edit "$ISSUE" --add-label "$unsaved"
          exit 0
        fi

        if [ -n "$older" ]; then
          gh issue comment "$ISSUE" --body "Not saved: the $kind record is #$older. Please edit that one instead."
          exit 0
        fi
        # Closing a record removed its rows; saving it closed would bring them back.
        if [ "$STATE" = closed ]; then
          gh issue comment "$ISSUE" --body "Not saved: this record is closed. Reopen it first, then comment \`/save\` again."
          exit 0
        fi

        # author_association lets read-only members through, so check the
        # commenter's actual role: owners with write access can save their own
        # personal record; the group record and other people's records need
        # maintain or admin (the representative), who checks them first.
        role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENTER/permission" -q .role_name || echo none)
        case "$role" in
          admin|maintain) ;;
          write)
            if [ "$kind" = group ]; then
              denied="the Green DiSC representative reviews and saves the group record. Your edits are kept and marked \`unsaved changes\` until then"
            elif [ "$COMMENTER" != "$owner" ]; then
              denied="only @$owner (the record's owner) or the Green DiSC representative can save this record"
            fi ;;
          *) denied="saving needs write access to this repository; ask the Green DiSC representative" ;;
        esac
        if [ -n "${denied:-}" ]; then
          gh issue comment "$ISSUE" --body "Not saved: $denied."
          exit 0
        fi
        gh issue edit "$ISSUE" --add-label "$label" > /dev/null

        commit_data save "Save Green DiSC record #$ISSUE"
        if [ -n "$invalid" ]; then
          {
            echo "Couldn't save this record, so nothing was changed. Please fix:"
            echo
            cat "$message"
            printf '\n\n'
            echo "Then edit this issue and comment \`/save\` again."
          } > "$reply"
          gh issue comment "$ISSUE" --body-file "$reply"
          exit 0
        fi
        {
          if [ -n "$commit_url" ]; then
            echo "Saved in $commit_url."
          else
            echo "No changes since the last save."
          fi
          echo
          cat "$message"
          printf '\n\n'
          echo "Keep this issue open: to change this record, edit it and comment \`/save\` again."
        } > "$reply"
        gh issue comment "$ISSUE" --body-file "$reply"
        gh issue edit "$ISSUE" --remove-label "$unsaved"

        # Tick this record's lines in open review check-ins. Another save may
        # edit the same check-in at the same time (the representative's lists
        # two records), and the later edit would undo this tick: re-read and
        # retry until it sticks.
        marker="<!-- record:$ISSUE -->"
        check_ins=$(gh issue list --label check-in --state open --limit 500 --json number,body || echo '[]')
        for number in $(jq -r --arg m "$marker" '.[] | select(.body | contains($m)) | .number' <<< "$check_ins"); do
          jq -r --argjson n "$number" '.[] | select(.number == $n) | .body' <<< "$check_ins" > "$RUNNER_TEMP/check-in.md"
          for attempt in 1 2 3 4 5; do
            if ! grep -qF -- "- [ ] " <(grep -F -- "$marker" "$RUNNER_TEMP/check-in.md"); then
              break
            fi
            python "$script" tick --body-file "$RUNNER_TEMP/check-in.md" --issue "$ISSUE"
            gh issue edit "$number" --body-file "$RUNNER_TEMP/check-in.md" > /dev/null
            sleep $((attempt * 2))
            gh issue view "$number" --json body --jq .body > "$RUNNER_TEMP/check-in.md"
          done
        done
