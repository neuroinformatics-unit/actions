name: 'Python test'
description: 'Run Python tests using uv'

inputs:
  python-version:
    description: 'Python version'
    required: true
    type: string
  pytest-args:
    description: 'Arguments to pass to the pytest command'
    required: false
    type: string
    default: ''
  install-extras:
    description: 'Comma-separated extras to install'
    required: false
    type: string
    default: 'dev'
  extra-dependencies:
    description: 'Space-separated packages to install on top of the main install'
    required: false
    type: string
    default: ''
  install-main-branch:
    description: 'Comma-separated list of GitHub repos to install from main branch'
    required: false
    type: string
    default: ''
  use-headless:
    description: 'Run tests with pyvista headless display'
    required: false
    type: boolean
    default: false
  install-mesa3d-offscreen:
    description: 'Install Mesa3D offscreen rendering for headless display'
    required: false
    type: boolean
    default: true
  codecov-flags:
    description: 'Flags to pass to codecov'
    required: false
    type: string
    default: ''
  secret-codecov-token:
    description: 'Codecov token to upload coverage reports'
    required: false

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}
        cache-dependency-glob: "**/pyproject.toml"
        activate-environment: true

    - name: Install main branch dependencies
      if: ${{ inputs.install-main-branch != '' }}
      shell: bash
      env:
        MAIN_BRANCH_DEPS: ${{ inputs.install-main-branch }}
      run: |
        IFS=',' read -ra repos <<< "$MAIN_BRANCH_DEPS"
        for repo in "${repos[@]}"; do
          uv pip install "git+https://github.com/${repo// /}"
        done

    - name: Install package and dependencies
      shell: bash
      env:
        EXTRAS: ${{ inputs.install-extras }}
        EXTRA_DEPS: ${{ inputs.extra-dependencies }}
      run: |
        if [[ -n "$EXTRA_DEPS" ]]; then
          uv pip install -e ".[$EXTRAS]" $EXTRA_DEPS
        else
          uv pip install -e ".[$EXTRAS]"
        fi

    - name: Set up headless display
      if: ${{ inputs.use-headless == 'true' }}
      uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79 # v5.1.0
      with:
        qt: true
        install-mesa3d-offscreen: ${{ inputs.install-mesa3d-offscreen }}

    - name: Run tests
      shell: bash
      run: pytest ${{ inputs.pytest-args }}

    - name: Issue deprecation warning for tokenless codecov
      shell: bash
      run: |
        if [[ -z "${{ inputs.secret-codecov-token }}" ]]; then
          echo '::warning::secret-codecov-token is not set. This will be required in the future.'\
          ' See https://docs.codecov.com/docs/quick-start#step-2-get-the-repository-upload-token on how to get a token.'
        fi

    - name: Report coverage to codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        flags: ${{ inputs.codecov-flags }}
        token: ${{ inputs.secret-codecov-token }}